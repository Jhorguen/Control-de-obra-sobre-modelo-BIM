name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Throwaway database for the API tests (they truncate every table).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: bim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bim -d bim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://bim:bim@localhost:5432/bim_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Also runs `prisma generate` through the server's postinstall script.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
