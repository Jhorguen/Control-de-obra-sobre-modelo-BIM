# Local development database only. These credentials never leave your machine;
# production uses the DATABASE_URL provided by the hosting service.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bim
      POSTGRES_PASSWORD: bim
      POSTGRES_DB: bim
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bim -d bim']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
